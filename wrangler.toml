# Cloudflare Workers Static Assets + thin Worker for SEO routing
name = "9six3-foo-v1"
main = "src/worker.js"
compatibility_date = "2026-08-11"
# Production landing is custom-domain only (not *.workers.dev)
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
# Run Worker first: www→apex 301; /index.html etc. rewritten to / (200 via ASSETS)
# html_handling keeps / serving index.html content correctly through ASSETS
run_worker_first = true
html_handling = "drop-trailing-slash"

[[routes]]
pattern = "9six3.foo/*"
zone_name = "9six3.foo"

[[routes]]
pattern = "www.9six3.foo/*"
zone_name = "9six3.foo"
