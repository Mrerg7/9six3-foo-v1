# Cloudflare Workers Static Assets + thin Worker for SEO redirects
name = "9six3-foo-v1"
main = "src/worker.js"
compatibility_date = "2026-08-11"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Run Worker first so www→apex and /index.html→/ are permanent 301s
# (asset HTML handling would otherwise emit 307s that GSC flags)
run_worker_first = true
html_handling = "drop-trailing-slash"

[[routes]]
pattern = "9six3.foo/*"
zone_name = "9six3.foo"

[[routes]]
pattern = "www.9six3.foo/*"
zone_name = "9six3.foo"
